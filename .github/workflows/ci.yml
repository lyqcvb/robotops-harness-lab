# RobotOps Harness Lab — 无 API Key 的持续集成检查
#
# CI 只做静态检查与单元测试，不需要任何凭据，也不调用模型：没有 secrets、没有 Agent 运行、没有人工审批步骤。
# 业务验证只走真实 Agent：需要 DEEPSEEK_API_KEY 的 `test:e2e`、`eval`、`demo` 和 `probe:live` 由维护者在本地运行。

name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: typecheck / lint / unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.x'

      # 锁文件安装，跳过生命周期脚本；与文档记录的 clean-room 命令一致。
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      # 单元测试包含脚本化适配器驱动的 runtime / 审批链路回归（tests/business/runtime-chain.test.ts），不调用模型。
      # 业务验证只走真实 Agent（需要 DEEPSEEK_API_KEY），由维护者在本地运行 npm run eval，不在 CI 中调用模型。
